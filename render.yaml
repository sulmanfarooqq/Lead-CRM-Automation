services:
  - type: web
    name: techtox-lead-response-agent
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: lead-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/data/leads.db
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: TIMEZONE
        value: Asia/Karachi
